name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: skills/sanmu-doc2md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: skills/sanmu-doc2md/scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/_selftest.py
      - run: python scripts/doctor.py
      - run: python -m unittest discover -s tests -v
        working-directory: skills/sanmu-paper-reader
      - run: python -m unittest discover -s tests -v
        working-directory: skills/sanmu-paper-search
      - run: python scripts/paper_search.py doctor
        working-directory: skills/sanmu-paper-search
