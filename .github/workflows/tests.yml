name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r skills/sanmu-doc2md/requirements.txt -r skills/sanmu-paper-reader/requirements.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: skills/sanmu-doc2md/scripts
      - run: python tests/sanmu-doc2md/_selftest.py
      - run: python skills/sanmu-doc2md/scripts/doctor.py
      - run: python -m unittest discover -s tests/sanmu-paper-reader -v
      - run: python -m unittest discover -s tests/sanmu-paper-search -v
      - run: python skills/sanmu-paper-search/scripts/paper_search.py doctor
